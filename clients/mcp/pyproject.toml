[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protectionpro-mcp"
version = "0.1.0"
description = "MCP server exposing ProtectionPro projects and studies to AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.24", "protectionpro-client"]

[project.scripts]
protectionpro-mcp = "protectionpro_mcp:main"

[tool.setuptools]
packages = ["protectionpro_mcp"]

[tool.setuptools.package-data]
protectionpro_mcp = ["component_catalog.json"]
