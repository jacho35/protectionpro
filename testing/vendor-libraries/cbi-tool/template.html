<div class="wrap">

      <div class="steps"><button type="button" id="dn" aria-label="Decrease current 5%">−</button><input id="cur" type="number" min="1" step="any" inputmode="decimal"><button type="button" id="up" aria-label="Increase current 5%">+</button></div></div>

<script>
const DATA = __DATA__;
const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

// The app's own log-log interpolation (constants.js _cbLogLogCurve): a monotone cubic through the published points.

function tolAt(spec, x) { if (spec == null) return 0; if (typeof spec === 'number') return spec; for (const [u, t] of spec) if (u == null || x <= u) return t; return 0; }

  const ltMax = M <= puHi ? Infinity : nom * (1 + tt);

function fmtT(t) {

  if (t < 10) return t.toFixed(2).replace(/0$/, '') + ' s';

}
function fmtA(a) { return a >= 1000 ? parseFloat((a / 1000).toPrecision(3)) + ' kA' : Math.round(a) + ' A'; }
function region(dev, b, I) {
  if (!isFinite(b.tmin) && !isFinite(b.tmax)) return ['Below pickup, will not trip', 'good'];

  if (b.where === 'inst') return ['Instantaneous, clears in ' + fmtT(b.tmax) + ' or less', 'bad'];
  if (b.where === 'st') return ['Short-time delay, clears in ' + fmtT(b.tmax) + ' or less', 'warn'];

// ---- state ----
const state = { devs: [], cur: 1000 };
function entryById(id) { for (const f of DATA.families) for (const e of f.entries) if (e.id === id) return e; return null; }
function mkDev(id) {

function addDev(id) {

let X0 = 1, X1 = 5; // log10 amps
function autoRange() {

  const lo = Math.min(...state.devs.map(d => d.rating)), hi = Math.max(...state.devs.map(d => d.rating));

const Y0 = -3, Y1 = 4; // log10 seconds: 1 ms .. 10 000 s
const W = 1000, H = 560, L = 62, R = 36, T = 14, B = 44, PW = W - L - R, PH = H - T - B;
const xp = I => L + (Math.log10(I) - X0) / (X1 - X0) * PW;
const yp = t => T + (Y1 - Math.log10(t)) / (Y1 - Y0) * PH;
const ix = px => Math.pow(10, X0 + (px - L) / PW * (X1 - X0));

function el(name, attrs, parent) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

function draw() {

  const g = el('g', {}, svg);
  // grid
  for (let d = Math.floor(X0); d <= Math.ceil(X1); d++) for (let m = 1; m < 10; m++) {
    const I = m * Math.pow(10, d); if (Math.log10(I) < X0 - 1e-9 || Math.log10(I) > X1 + 1e-9) continue;

  }
  for (let d = Y0; d <= Y1; d++) for (let m = 1; m < 10; m++) {

    el('line', { x1: L, x2: L + PW, y1: yp(t), y2: yp(t), stroke: m === 1 ? 'var(--grid)' : 'var(--grid2)', 'stroke-width': m === 1 ? 1.2 : 1 }, g);
  }

  for (let d = Math.ceil(X0); d <= Math.floor(X1); d++) { const I = Math.pow(10, d);
    const t = el('text', { x: xp(I), y: T + PH + 16, 'text-anchor': 'middle', class: 'tick' }, g); t.textContent = fmtA(I); }
  const yl = { '-3': '1 ms', '-2': '10 ms', '-1': '0.1 s', '0': '1 s', '1': '10 s', '2': '100 s', '3': '1000 s', '4': '10 000 s' };
  for (let d = Y0; d <= Y1; d++) { const t = el('text', { x: L - 8, y: yp(Math.pow(10, d)) + 4, 'text-anchor': 'end', class: 'tick' }, g); t.textContent = yl[d]; }
  const xt = el('text', { x: L + PW / 2, y: H - 6, 'text-anchor': 'middle', class: 'axt' }, g); xt.textContent = 'PROSPECTIVE CURRENT';
  const yt = el('text', { x: 14, y: T + PH / 2, 'text-anchor': 'middle', class: 'axt', transform: `rotate(-90 14 ${T + PH / 2})` }, g); yt.textContent = 'TRIPPING TIME';

}
function setCur(I) { state.cur = Math.min(Math.max(I, Math.pow(10, X0)), Math.pow(10, X1)); $('cur').value = Math.round(state.cur * 10) / 10; draw(); const h = document.querySelector('.handle'); if (h && document.activeElement && document.activeElement.id === 'plot') h.focus({ preventScroll: true }); }
function chips() {
  const c = $('chips'); c.textContent = '';
  state.devs.forEach((d, k) => {
    const s = document.createElement('span'); s.className = 'chip';
    s.innerHTML = `<i style="background:${COLORS[k % COLORS.length]}"></i>`;
    s.appendChild(document.createTextNode(d.name));
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + d.name);
    x.onclick = () => { state.devs.splice(k, 1); autoRange(); draw(); }; s.appendChild(x); c.appendChild(s);
  });
  if (!state.devs.length) c.innerHTML = '<span class="sub">Pick a range and a breaker, then Add to plot.</span>';
}
const SET_LABEL = { thermal_pickup: 'Ir', long_time_delay: 'tL (s at 2 × Ir)', short_time_pickup: 'Is', short_time_delay: 'Ts (s)', instantaneous_pickup: 'Ii (× In)' };
function fmtSet(dev, k, v) {
  if (k === 'thermal_pickup') return Math.round(v * dev.rating) + ' A (' + v.toFixed(2) + ' × In)';
  if (k === 'short_time_pickup') return v + ' × ' + (DATA.profiles[dev.pid].d[k].base === 'In' ? 'In' : 'Ir');
  return String(v);
}
// dial controls for a breaker whose trip unit has adjustable settings (Ir on the thermal-adjustable F65DV, all five on the electronic DE types)
function settings() {
  const box = $('sets'); box.textContent = '';
  state.devs.forEach((d, k) => {
    const dials = DATA.profiles[d.pid].d, keys = Object.keys(SET_LABEL).filter(x => dials[x] && dials[x].steps && dials[x].steps.length > 1);
    if (!keys.length) return;
    const row = document.createElement('div'); row.className = 'set';
    row.innerHTML = `<span class="nm"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:${COLORS[k % COLORS.length]}"></i>${d.name} settings</span>`;
    keys.forEach(key => {
      const f = document.createElement('div'); f.className = 'field';
      const id = `set_${k}_${key}`; f.innerHTML = `<label for="${id}">${SET_LABEL[key]}</label>`;
      const sel = document.createElement('select'); sel.id = id;
      dials[key].steps.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = fmtSet(d, key, v); if (Number(v) === Number(d.s[key])) o.selected = true; sel.appendChild(o); });
      sel.onchange = () => { d.s[key] = Number(sel.value); draw(); };
      f.appendChild(sel); row.appendChild(f);
    });
    box.appendChild(row);
  });
}
function readout() {
  const tb = $('tbl').tBodies[0]; tb.textContent = '';
  state.devs.forEach((d, k) => {
    const b = band(d, state.cur), r = region(d, b, state.cur), tr = document.createElement('tr');
    const over = state.cur / 1000 > d.icu;
    tr.innerHTML = `<td class="dev"><i style="background:${COLORS[k % COLORS.length]}"></i>${d.name}<small>${d.series}, ${d.rating} A</small></td>
      <td class="n">${b.M.toFixed(b.M < 10 ? 2 : 1)}</td><td class="n">${fmtT(b.tmin)}</td><td class="n">${fmtT(b.tmax)}</td>
      <td><span class="pill ${r[1]}">${r[0]}</span></td><td>${d.icu} kA${over ? ' <span class="pill bad">exceeded</span>' : ''}</td>`;
    tb.appendChild(tr);
  });
  // discrimination: the larger breaker is taken as upstream; its fastest time against the smaller one's slowest
  const v = $('verdict'); v.textContent = ''; v.className = '';
  if (state.devs.length >= 2) {
    const sorted = state.devs.slice().sort((a, b) => b.rating - a.rating), up = sorted[0], dn = sorted[1];
    const bu = band(up, state.cur), bd = band(dn, state.cur);
    const ok = isFinite(bd.tmax) && bu.tmin > bd.tmax;
    const none = !isFinite(bd.tmax);
    v.className = 'verdict' + (ok ? ' ok' : '');
    v.innerHTML = none ? `At ${fmtA(state.cur)} the downstream <b>${dn.name}</b> is below its trip limit.`
      : ok ? `At ${fmtA(state.cur)}: upstream <b>${up.name}</b> is no faster than ${fmtT(bu.tmin)} and downstream <b>${dn.name}</b> clears by ${fmtT(bd.tmax)}. The published curves do not overlap here.`
      : `At ${fmtA(state.cur)}: upstream <b>${up.name}</b> may trip in ${fmtT(bu.tmin)}, while downstream <b>${dn.name}</b> may take up to ${fmtT(bd.tmax)}. The curves overlap, so time discrimination is not guaranteed.`;
  }
}

// ---- pointer: click or drag anywhere on the plot to move the cursor ----
const svg = $('plot'); let dragging = false;
function fromEvent(e) { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W; return ix(Math.min(Math.max(px, L), L + PW)); }
svg.addEventListener('pointerdown', e => { dragging = true; svg.setPointerCapture(e.pointerId); setCur(fromEvent(e)); });
svg.addEventListener('pointermove', e => { if (dragging) setCur(fromEvent(e)); });
['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, () => { dragging = false; }));

// ---- pickers ----
function fillFam() { $('fam').innerHTML = DATA.families.map((f, i) => `<option value="${i}">${f.label}</option>`).join(''); fillEnt(); }
function fillEnt() { const f = DATA.families[+$('fam').value]; $('ent').innerHTML = f.entries.map(e => `<option value="${e.id}">${e.label}</option>`).join(''); }
$('fam').onchange = fillEnt;
$('add').onclick = () => addDev($('ent').value);
$('cur').addEventListener('change', e => { const v = parseFloat(e.target.value); if (v > 0) setCur(v); });
$('up').onclick = () => setCur(state.cur * 1.05); $('dn').onclick = () => setCur(state.cur / 1.05);

function notes() {
  $('notes').innerHTML = `<p>The shaded band runs from the fastest (dashed) to the slowest (solid) time each breaker may take, as printed in the CBI data sheet at 30 °C. Between the two the actual trip time depends on the individual breaker. The instantaneous region is drawn flat at the sheet's floor times.</p>
  <p>Adjustable breakers (the F65DV and the electronic types) show their settings under the plot; the instantaneous trip is against In, so the Ir setting does not move it. Discrimination here only compares published curves. It does not use CBI's selectivity or cascading data, which the curves cannot show.</p>`;
}
fillFam(); notes();
['cbi_l20b_175', 'cbi_qf26hr_c1_80'].forEach(addDev);
if (!state.devs.length) addDev(DATA.families[0].entries[0].id);
autoRange(); setCur(1000);
</script>
