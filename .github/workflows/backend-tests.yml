name: Backend tests

# Runs the standards-anchored regression suite (IEC 60909, IEEE 1584 / 80, …)
# in backend/tests/ so analysis-engine changes can't merge with red tests.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run regression tests
        run: python -m pytest backend/tests/ -q

      # Independent closed-form cross-checks of the newer engines (frequency
      # scan, filter, reliability, voltage stability, hosting capacity, CT,
      # battery, cap placement, OPF, contingency, EE-10, flicker). Exits 1 on
      # any FAIL; --no-results keeps the checked-in results.json untouched.
      - name: Run new-features verification harness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python testing/case-new-features-verification/verify_new_features.py --no-results

  frontend-unit:
    # Node tests that evaluate the real frontend modules in a vm sandbox:
    # TCC curves against the IEC gates (TCC review TC1-TC3) and distance
    # zone grading, the compliance rules (compliance review C1-C9) and the
    # breaker pickup reference current (a manufacturer's Ii is held against In).
    # (frontend/tests/test_migration.mjs is not wired in yet —
    # it needs a DEFAULT_VOLTAGE_FACTOR stub.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TCC curves
        run: node frontend/tests/test_tcc_curves.mjs
      - name: Distance zone grading
        run: node frontend/tests/test_distance_grading.mjs
      - name: Compliance rules
        run: node frontend/tests/test_compliance.mjs
      - name: Breaker pickup reference current (Ir / In)
        run: node frontend/tests/test_pickup_base.mjs
      - name: Cascading (back-up protection, IEC 60947-2 Annex A)
        run: node frontend/tests/test_cascading.mjs

      - name: DB earth-leakage units and switched sections
        run: node frontend/tests/test_db_el_units.mjs
      - name: Sync speed fixes (board index, street-lighting changed circuits only)
        run: node frontend/tests/test_sync_speed.mjs
      - name: Out-of-date study results (network signature, kept after an edit)
        run: node frontend/tests/test_stale_results.mjs
      - name: Sync pass (order, idempotence, adopt overrides, drag / remote / off)
        run: node frontend/tests/test_sync_pass.mjs
      - name: Reticulation kept in sync (site plan → Demand, overrides, deletions with undo)
        run: node frontend/tests/test_retic_sync.mjs
      - name: Street lighting kept in sync (site-plan poles and road-plan circuits, spans, deletions)
        run: node frontend/tests/test_sl_sync.mjs
      - name: Demand → single line kept in sync (background ADMD, loads, transformer, deletions)
        run: node frontend/tests/test_demand_sld.mjs
      - name: Links (one table of every link between workspaces, link marks)
        run: node frontend/tests/test_links.mjs
      - name: Results view switch (study chips, dots, Values)
        run: node frontend/tests/test_result_view.mjs
      - name: Results panel (tabs, row status, sorting, filters, dock)
        run: node frontend/tests/test_results_panel.mjs
      - name: Issues and Overview (every workspace's fails, Issues tab, Overview rows, tabs)
        run: node frontend/tests/test_issues_overview.mjs
      - name: Start screen (sign-in action, recent list, one sample per type)
        run: node frontend/tests/test_startscreen.mjs
      - name: Help per project type (guides listed for each type exist)
        run: node frontend/tests/test_help_types.mjs
      - name: Project settings (value rules, sections, when the electrical values apply)
        run: node frontend/tests/test_projectsettings.mjs
      - name: Save-state chip and autosave rules
        run: node frontend/tests/test_savestate.mjs
      - name: Ctrl K finds items inside the workspaces (kiosks, erven, boards, ways, rooms)
        run: node frontend/tests/test_search_items.mjs
      - name: Analyse menu (needs-a-selection reasons) and Study Manager status
        run: node frontend/tests/test_analysemenu.mjs
      - name: Property panel label rules and section filter
        run: node frontend/tests/test_propfilter.mjs
      - name: Undo / Redo name their action
        run: node frontend/tests/test_undo_names.mjs

      - name: Raw HTML interpolation ratchet (new unescaped attribute values fail)
        run: node testing/lint/raw-interp.mjs --max 0

  ui-templates:
    # Loads every Verification / Standards template in the real app (headless
    # Chromium), runs its analysis from the Analyse menu and asserts the
    # headline numbers — testing/ui/verify_templates_ui.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Install Playwright + Chromium
        working-directory: testing/ui
        run: npm install && npx playwright install --with-deps chromium

      - name: Start app on a throwaway database
        env:
          DATABASE_URL: sqlite:////tmp/pp-ui.db
          SECRET_KEY: ci-ui-verify-only
        run: |
          nohup python -m uvicorn backend.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done

      - name: Verify templates through the UI
        working-directory: testing/ui
        run: node verify_templates_ui.mjs

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failures
          path: |
            testing/ui/ui-failures/
            /tmp/uvicorn.log
          if-no-files-found: ignore
