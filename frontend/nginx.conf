# Second layer behind the backend's own sign-in throttle: per-IP rate on /api/auth/.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Everyone arrives through one TLS-terminating proxy, so $remote_addr is that proxy.
    # Take the client address from its X-Forwarded-For, trusting that header only when the
    # connection comes from a private address (the proxy / the Docker network). The proxy
    # must set it, e.g. `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend static files.
    # no-cache ≠ no-store: browsers may keep a copy but MUST revalidate
    # (ETag/If-None-Match) before using it. Without this, heuristic caching
    # can mix old and new JS modules across deploys (e.g. a fresh app.js
    # calling a function that doesn't exist in a stale cached api.js).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Sign-in, registration, reset and device routes: burst-limited per client IP.
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Plan-markup rasters (A0/A1 PDFs rendered at high DPI) can be tens of
        # MB; the backend enforces its own 60 MB cap.
        client_max_body_size 60m;
        client_body_buffer_size 1m;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
